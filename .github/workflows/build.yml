name: Build and Release

on:
  # 每次推送到 main 或 master 分支时触发
  push:
    branches: [ main, master ]
  # 保留手动触发功能
  workflow_dispatch:

jobs:
  # ==========================================
  # 0. 代码质量检查任务（已简化，移除报错的 lint）
  # ==========================================
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      # 【修改】移除了 npm run lint，防止因缺少脚本报错
      # 如果后续需要测试，可以取消下面注释
      # - name: Run Tests
      #   run: npm test

  # ==========================================
  # 1. Linux 构建任务
  # ==========================================
  build-linux:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 upx-ucl

      - name: Install Project Dependencies
        run: npm ci

      - name: Install boxednode
        run: npm install -g boxednode

      - name: Compile Linux Binary
        run: |
          # 【关键修改】入口文件改为 ./main.js
          boxednode --source ./main.js --output ./Non-existentMinecraftLauncher_linux_x64
          
          if [ ! -f "./Non-existentMinecraftLauncher_linux_x64" ]; then
            echo "错误：编译完成但未找到文件！"
            exit 1
          fi
          chmod +x ./Non-existentMinecraftLauncher_linux_x64

      - name: Compress with UPX
        run: upx --best ./Non-existentMinecraftLauncher_linux_x64 || true # 加上 || true 防止压缩失败导致流程中断

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: ./Non-existentMinecraftLauncher_linux_x64

  # ==========================================
  # 2. Windows 构建任务
  # ==========================================
  build-windows:
    needs: lint-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 【新增】Windows 编译通常需要 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install boxednode
        run: npm install -g boxednode

      - name: Compile Windows Binary
        run: |
          # 【关键修改】入口文件改为 ./main.js
          boxednode --source ./main.js --output ./Non-existentMinecraftLauncher_windows_x64.exe
          
          if (-Not (Test-Path "./Non-existentMinecraftLauncher_windows_x64.exe")) {
            Write-Error "编译失败：未找到文件"
            exit 1
          }
        shell: pwsh

      - name: Install UPX (Windows)
        run: choco install upx --no-progress

      - name: Compress with UPX
        run: upx --best ./Non-existentMinecraftLauncher_windows_x64.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: ./Non-existentMinecraftLauncher_windows_x64.exe

  # ==========================================
  # 3. 发布任务
  # ==========================================
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: ./dist

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: ./dist

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-test.${{ github.run_number }}
          name: Test Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: true 
          files: |
            ./dist/Non-existentMinecraftLauncher_linux_x64
            ./dist/Non-existentMinecraftLauncher_windows_x64.exe
