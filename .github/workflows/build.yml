name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arch: x64
          - os: macos-latest
            target: macos
            arch: x64
          - os: windows-latest
            target: win
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      # 【修改】安装 boxednode 替代 pkg/nexe
      - name: Install boxednode Globally
        run: npm install -g boxednode

      - name: Install UPX
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update && sudo apt-get install -y upx
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            brew install upx
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            choco install upx
          fi

      - name: Build Executable with boxednode
        shell: bash
        run: |
          # 1. 生成文件名：仓库名-系统-架构-版本号
          FILE_NAME="${{ github.event.repository.name }}-${{ matrix.target }}-${{ matrix.arch }}-${{ github.ref_name }}"
          
          # Windows 自动加 .exe 后缀
          if [[ "${{ matrix.target }}" == "win" ]]; then
            FILE_NAME="${FILE_NAME}.exe"
          fi
          
          # 2. 使用 boxednode 打包
          # -s: 源文件 (入口文件)
          # -t: 目标文件路径
          # -n: 指定 Node.js 版本
          boxednode -s index.js -t dist/$FILE_NAME -n 20

      - name: Compress with UPX
        shell: bash
        run: |
          # 极限压缩
          upx --best --lzma dist/* || true
          ls -lh dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
