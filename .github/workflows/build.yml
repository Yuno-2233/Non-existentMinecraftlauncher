name: Build Ultra-Light Launcher (Bun + UPX)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Linux 构建任务
  # ==========================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Compile with Bun
        run: |
          # 编译入口文件 main.js
          bun build ./main.js --compile --outfile Non-existentMinecraftlauncher-linux-x64

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Compress with UPX
        run: upx --best --lzma Non-existentMinecraftlauncher-linux-x64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Non-existentMinecraftlauncher-linux-x64
          path: Non-existentMinecraftlauncher-linux-x64

  # ==========================================
  # 2. Windows 构建任务
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Compile with Bun
        run: |
          # Windows 下编译
          bun build ./main.js --compile --outfile Non-existentMinecraftlauncher-win-x64.exe
        shell: pwsh

      - name: Install UPX (Windows)
        run: choco install upx --no-progress

      - name: Compress with UPX
        run: upx --best --lzma Non-existentMinecraftlauncher-win-x64.exe
        shell: pwsh

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Non-existentMinecraftlauncher-win-x64
          path: Non-existentMinecraftlauncher-win-x64.exe

  # ==========================================
  # 3. 发布 Release
  # ==========================================
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: Non-existentMinecraftlauncher-linux-x64
      
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Non-existentMinecraftlauncher-win-x64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Non-existentMinecraftlauncher-linux-x64
            Non-existentMinecraftlauncher-win-x64.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
