name: Build Multi-Arch Launcher

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      # --- 新增：为 Windows 自动生成 winres.json (解决之前的报错) ---
      - name: Generate Windows Resources (Windows Only)
        if: matrix.os == 'windows'
        run: |
          mkdir -p winres
          cat > winres/winres.json << EOF
          {
            "RT_MANIFEST": { "#1": { "0409": { "identity": { "name": "Non-existentMinecraftlauncher", "version": "1.0.0.0" }, "description": "", "minimum-os": "vista", "execution-level": "as invoker", "ui-access": false, "auto-elevate": false, "dpi-awareness": "system", "disable-theming": false, "disable-window-filtering": false } } }
          }
          EOF

      # --- 核心修复：在编译时开启国内代理 (解决 wazero 下载超时) ---
      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
          GOPROXY: https://goproxy.cn,direct
        run: |
          OUTPUT_NAME="Non-existentMinecraftlauncher-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          echo "Building $OUTPUT_NAME..."
          go build -ldflags="-s -w" -o "$OUTPUT_NAME" ./cmd/launcher

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Non-existentMinecraftlauncher-${{ matrix.os }}-${{ matrix.arch }}
          path: Non-existentMinecraftlauncher-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
