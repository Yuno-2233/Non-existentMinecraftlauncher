name: Build and Release Binaries (boxednode + UPX)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # 统一使用 Linux 环境
    
    strategy:
      matrix:
        include:
          # 1. 构建 Linux 原生版本
          - target: linux
            output_name: launcher-linux-x64
            setup_cmd: "sudo apt-get update && sudo apt-get install -y upx"
            # 这里的逻辑改为：先编译，再重命名，最后压缩
            build_cmd: "boxednode -s main.js && mv main launcher-linux-x64 && upx --best --lzma launcher-linux-x64"
            
          # 2. 构建 Windows 交叉编译版本
          - target: win
            output_name: launcher-win-x64.exe
            setup_cmd: "sudo apt-get update && sudo apt-get install -y mingw-w64 upx"
            # Windows 同理：先编译(默认生成 main.exe)，再重命名，最后压缩
            build_cmd: "boxednode -s main.js -t win-x64 && mv main.exe launcher-win-x64.exe && upx --best --lzma launcher-win-x64.exe"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install boxednode Globally
        run: npm install -g boxednode

      - name: Setup Build Environment & Compile
        run: ${{ matrix.setup_cmd }}

      - name: Build & Compress
        run: ${{ matrix.build_cmd }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ${{ matrix.output_name }}
