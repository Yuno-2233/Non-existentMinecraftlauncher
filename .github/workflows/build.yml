name: Build Launcher

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [windows]
        arch: [amd64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.x' # 已更新版本以支持 wazero v1.12.0
          cache: true

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Generate Windows Resources
        if: matrix.os == 'windows'
        run: |
          cd cmd/launcher
          go-winres make

      - name: Build Binary
        env:
          BINARY_NAME: "Non-existentMinecraftLauncher"
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            export BINARY_NAME="${BINARY_NAME}.exe"
          fi
          mkdir -p dist/${{ matrix.os }}-${{ matrix.arch }}
          go build -o "dist/${{ matrix.os }}-${{ matrix.arch }}/${BINARY_NAME}" ./cmd/launcher

      - name: Package Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}-build
          path: dist/
