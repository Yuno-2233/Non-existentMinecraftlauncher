name: Build Launcher

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            arch: amd64
          - os: ubuntu-latest
            goos: linux
            arch: amd64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # --- Windows 专属：嵌入图标 ---
      - name: Install go-winres
        if: matrix.goos == 'windows'
        run: go install github.com/tc-hib/go-winres@latest

      - name: Generate Windows Resources
        if: matrix.goos == 'windows'
        run: go-winres make

      # --- 核心编译步骤 ---
      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: |
          BINARY_NAME="Non-existentMinecraftlauncher"
          if [ "${{ matrix.goos }}" = "windows" ]; then BINARY_NAME="${BINARY_NAME}.exe"; fi
          go build -ldflags="-s -w" -o "${BINARY_NAME}" ./cmd/launcher


      # --- 打包与上传 ---
      - name: Package Artifacts
        shell: bash
        run: |
          mkdir -p dist
          BINARY_NAME="Non-existentMinecraftlauncher"
          if [ "${{ matrix.goos }}" = "windows" ]; then BINARY_NAME="${BINARY_NAME}.exe"; fi
          
          # 将二进制文件移入 dist
          mv "$BINARY_NAME" dist/
          
          # 如果是 Linux，把图标和桌面快捷方式也打包进去
          if [ "${{ matrix.goos }}" = "linux" ]; then
            cp icon.png dist/ || echo "Warning: icon.png not found"
            cp Non-existentMinecraftlauncher.desktop dist/ || echo "Warning: desktop file not found"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.goos }}-${{ matrix.arch }}
          path: dist/
