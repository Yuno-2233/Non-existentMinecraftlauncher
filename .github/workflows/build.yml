name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 1. 构建 Linux 版本
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies & UPX
        run: |
          npm install boxednode -g
          sudo apt-get update
          sudo apt-get install -y upx

      - name: Compile Linux Binary
        # 关键点：加上 -t v18.0.0 指定版本，加上 -o 指定输出文件名
        run: |
          boxednode -s main.js -t v18.0.0 -o launcher-linux-x64
          upx --best --lzma launcher-linux-x64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-linux-x64
          path: launcher-linux-x64

  # 2. 构建 Windows 版本 (交叉编译)
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies & UPX
        run: |
          npm install boxednode -g
          sudo apt-get update
          sudo apt-get install -y upx mingw-w64

      - name: Compile Windows Binary
        # 关键点：Windows 交叉编译需要指定 arch x64 和 platform win32
        run: |
          boxednode -s main.js -t v18.0.0 -o launcher-win-x64.exe --arch x64 --platform win32
          upx --best --lzma launcher-win-x64.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-win-x64.exe
          path: launcher-win-x64.exe

  # 3. 发布 Release
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
