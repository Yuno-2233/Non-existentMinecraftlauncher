name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target_os: linux
            output_ext: ""
          - os: windows-latest
            target_os: win
            output_ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install boxednode Globally
        run: npm install -g boxednode

      - name: Get Project Name
        id: get_name
        run: echo "PROJECT_NAME=$(node -p "require('./package.json').name")" >> $GITHUB_ENV

      - name: Build Executable with boxednode
        run: |
          # 关键修复：添加了 -t x64 参数来指定架构
          boxednode -s main.js -o ${{ env.PROJECT_NAME }}-${{ matrix.target_os }}${{ matrix.output_ext }} -t x64

      - name: Compress with UPX (Optional)
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            sudo apt-get install -y upx-ucl
            upx --best --lzma ${{ env.PROJECT_NAME }}-${{ matrix.target_os }}${{ matrix.output_ext }} || true
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.target_os }}
          path: ${{ env.PROJECT_NAME }}-${{ matrix.target_os }}${{ matrix.output_ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # 只有打标签时才发布

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            */*
