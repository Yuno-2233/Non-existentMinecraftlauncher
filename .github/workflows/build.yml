name: Build and Release

# 去掉 tags 限制，改为 push 到 main/master 分支或手动触发时运行
on:
  push:
    branches: [ main, master ] # 你可以根据实际分支名修改
  workflow_dispatch: # 允许手动点击按钮运行

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install System Dependencies (Crucial)
        run: |
          sudo apt-get update
          # 安装编译 Node.js 源码必须的 C++ 编译器、Make 和 Python
          sudo apt-get install -y build-essential python3 upx

      - name: Install boxednode
        run: npm install -g boxednode

      - name: Compile Linux Binary
        run: |
          # -t v18.0.0 指定目标版本，-o 指定输出文件名
          boxednode -s main.js -t v18.0.0 -o launcher-linux-x64
          # 压缩体积
          upx --best --lzma launcher-linux-x64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-linux-x64
          path: launcher-linux-x64

  build-windows:
    runs-on: ubuntu-latest # 继续使用 Ubuntu 进行交叉编译
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 upx

      - name: Install boxednode
        run: npm install -g boxednode

      - name: Compile Windows Binary
        run: |
          # 交叉编译 Windows 版本
          boxednode -s main.js -t v18.0.0 -o launcher-win-x64.exe --cross-compile-prefix=x86_64-w64-mingw32-
          upx --best --lzma launcher-win-x64.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-win-x64
          path: launcher-win-x64.exe
