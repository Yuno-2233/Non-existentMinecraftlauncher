name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target_os: linux
            output_ext: ""
          - os: windows-latest
            target_os: win
            output_ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install boxednode Globally
        run: npm install -g boxednode

      - name: Get Project Name
        id: get_name
        run: echo "PROJECT_NAME=$(node -p "require('./package.json').name")" >> $GITHUB_ENV

      - name: Build Executable with boxednode
        run: |
          # 关键修改：将 src/index.js 改为 main.js
          boxednode --source main.js --output ${{ env.PROJECT_NAME }}-${{ matrix.target_os }}${{ matrix.output_ext }} --name "${{ env.PROJECT_NAME }}"

      - name: Compress with UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: |
            ./${{ env.PROJECT_NAME }}-${{ matrix.target_os }}${{ matrix.output_ext }}
          args: --best --lzma

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target_os }}
          path: ${{ env.PROJECT_NAME }}-${{ matrix.target_os }}${{ matrix.output_ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            binary-linux/*
            binary-win/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
