name: Build Multi-Arch Launcher

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Prepare Build Environment
      run: |
        python3 build_launcher.py
        mkdir -p build

    - name: Build Launcher Binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        go build -ldflags="-s -w" -o build/launcher-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/launcher

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: launcher-${{ matrix.goos }}-${{ matrix.goarch }}
        path: build/launcher-${{ matrix.goos }}-${{ matrix.goarch }}
