name: Build and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Linux 构建任务 (原生)
  # ==========================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Linux Binary with nexe
        run: |
          npx nexe src/index.js \
            --target linux-x64-18.0.0 \
            --output dist/launcher-linux

      - name: Compress with UPX
        run: |
          sudo apt-get install -y upx
          upx -9 dist/launcher-linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-linux
          path: dist/launcher-linux

  # ==========================================
  # 2. Windows 构建任务 (Linux 交叉编译)
  # ==========================================
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Cross-Compile Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y wine mingw-w64

      - name: Install Dependencies
        run: npm ci

      - name: Build Windows Binary with nexe
        run: |
          npx nexe src/index.js \
            --target win-x64-18.0.0 \
            --output dist/launcher-windows.exe

      - name: Compress with UPX
        run: |
          sudo apt-get install -y upx
          upx -9 dist/launcher-windows.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: dist/launcher-windows.exe
