name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target_os: linux
            output_ext: ""
          - os: windows-latest
            target_os: win
            output_ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install boxednode Globally
        run: npm install -g boxednode

      - name: Get Project Name
        id: project_name
        run: echo "PROJECT_NAME=$(node -p "require('./package.json').name")" >> $GITHUB_ENV

      - name: Build Executable with boxednode
        run: |
          # 关键修复：硬编码 target 为 x64，彻底避开后缀名干扰
          if [ "${{ matrix.target_os }}" = "win" ]; then
            echo "Building for Windows x64..."
            boxednode -s main.js -o ${{ env.PROJECT_NAME }}-win-x64.exe -t x64
          else
            echo "Building for Linux x64..."
            boxednode -s main.js -o ${{ env.PROJECT_NAME }}-linux-x64 -t x64
          fi

      - name: Compress with UPX (Optional)
        run: |
          if [ "${{ matrix.target_os }}" = "linux" ]; then
            sudo apt-get install -y upx-ucl
            upx --best --lzma ${{ env.PROJECT_NAME }}-linux-x64 || true
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.target_os }}-x64
          path: ${{ env.PROJECT_NAME }}-${{ matrix.target_os }}-x64${{ matrix.output_ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            */*.exe
            */non-existent-mc-launcher-linux-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
