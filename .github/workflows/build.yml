name: Build and Release Binaries (boxednode + UPX)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # 统一使用 Linux 环境，速度快且稳定
    
    strategy:
      matrix:
        include:
          # 1. 构建 Linux 原生版本
          - target: linux
            output_name: launcher-linux-x64
            setup_cmd: "sudo apt-get update && sudo apt-get install -y upx"
            build_cmd: "boxednode -s main.js -o launcher-linux-x64 -t x64"
            
          # 2. 构建 Windows 交叉编译版本
          - target: win
            output_name: launcher-win-x64.exe
            setup_cmd: "sudo apt-get update && sudo apt-get install -y mingw-w64 upx"
            build_cmd: "boxednode -s main.js -o launcher-win-x64.exe -t win-x64"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install boxednode Globally
        run: npm install -g boxednode

      - name: Setup Build Environment & Compile
        run: |
          ${{ matrix.setup_cmd }}
          ${{ matrix.build_cmd }}

      - name: Compress with UPX (Optional)
        run: |
          if [ "${{ matrix.target }}" = "win" ]; then
            upx --best --lzma launcher-win-x64.exe
          else
            upx --best --lzma launcher-linux-x64
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ${{ matrix.output_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            launcher-linux-x64
            launcher-win-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
