name: Build Multi-Arch Launcher

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Prepare Build Environment
      run: |
        # 确保根目录下有 build 文件夹
        mkdir -p build

    - name: Build binary
      run: |
        # 判断是否为 Windows 系统，如果是则添加 .exe 后缀
        if [ "${{ matrix.goos }}" = "windows" ]; then
          EXT=".exe"
        else
          EXT=""
        fi
        
        # 设置输出文件名 (例如: launcher-windows-amd64.exe)
        OUTPUT_NAME="launcher-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
        
        echo "Building ${OUTPUT_NAME}..."
        
        # 执行交叉编译
        CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
          -ldflags="-s -w" \
          -o "build/${OUTPUT_NAME}" \
          ./cmd/launcher

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: launcher-${{ matrix.goos }}-${{ matrix.goarch }}
        path: build/launcher-${{ matrix.goos }}-${{ matrix.goarch }}*
        retention-days: 7
