name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如: v2.0.1)'
        required: true
        type: string
      prerelease:
        description: '是否标记为预发布版本'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 统一版本号变量：标签触发用 ref_name，手动触发用输入值
      - name: Resolve version name
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release package
        run: |
          mkdir -p build/release
          cp app/build/libs/app.jar build/release/
          cp start.bat start.sh build/release/
          chmod +x build/release/start.sh
          cd build/release
          zip -r ../Non-existentMinecraftLauncher-${{ steps.version.outputs.name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          files: build/Non-existentMinecraftLauncher-${{ steps.version.outputs.name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || (contains(steps.version.outputs.name, '-alpha') || contains(steps.version.outputs.name, '-beta') || contains(steps.version.outputs.name, '-rc')) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
