name: Build and Release

on:
  push:
    tags:
      - 'v*' # 当推送 v 开头的标签时触发（如 v1.0.0）
  workflow_dispatch: # 允许手动触发
    inputs:
      version:
        description: '版本号 (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: '是否为预发布版本 (Pre-release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Java 环境 (根据你的项目需求修改 java-version)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 赋予 Gradle 执行权限并构建
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      # 4. 准备发布包 & 动态生成脚本 (核心步骤)
      - name: Prepare Release Assets
        id: prepare_assets
        run: |
          # 创建输出目录
          mkdir -p build/release

          # --- 动态查找 JAR 包 ---
          # 在 app/build/libs 下查找 .jar 文件，排除 sources 和 javadoc
          # 如果你的项目结构不同，请修改 app/build/libs 为 build/libs
          JAR_PATH=$(find app/build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          
          if [ -z "$JAR_PATH" ]; then
            echo "❌ 错误：未找到构建产物！请检查路径。"
            exit 1
          fi

          # 获取纯文件名 (例如: launcher-1.0.0.jar)
          JAR_NAME=$(basename "$JAR_PATH")
          echo "✅ 找到构建产物: $JAR_NAME"

          # 复制 JAR 到发布目录
          cp "$JAR_PATH" build/release/

          # --- 动态生成 Windows 启动脚本 (start.bat) ---
          # 使用 printf 避免 heredoc 在某些 shell 下的缩进问题
          printf "@echo off\r\necho Starting %s...\r\njava -jar %s\r\npause\r\n" "$JAR_NAME" "$JAR_NAME" > build/release/start.bat

          # --- 动态生成 Linux/Mac 启动脚本 (start.sh) ---
          printf "#!/bin/bash\necho 'Starting %s...'\njava -jar %s\n" "$JAR_NAME" "$JAR_NAME" > build/release/start.sh
          chmod +x build/release/start.sh

          # 将文件名传递给下一步
          echo "jar_name=$JAR_NAME" >> $GITHUB_OUTPUT

      # 5. 创建 Release 并上传
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # 如果是手动触发，使用输入的 version；如果是 tag 推送，使用 github.ref_name
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            build/release/*.jar
            build/release/start.bat
            build/release/start.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
