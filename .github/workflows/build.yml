name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: linux
            final_name: launcher-linux-x64
            setup_cmd: "sudo apt-get update && sudo apt-get install -y upx"
            # 关键修复：使用 -o 强制指定输出文件名，不再依赖默认行为
            build_cmd: "boxednode -s main.js -o launcher-linux-x64 && upx --best --lzma launcher-linux-x64"
            
          - target: win
            final_name: launcher-win-x64.exe
            setup_cmd: "sudo apt-get update && sudo apt-get install -y upx mingw-w64"
            # 关键修复：使用 -o 强制指定输出文件名，包含 .exe 后缀
            build_cmd: "boxednode -s main.js -t win32 -a x64 -o launcher-win-x64.exe && upx --best --lzma launcher-win-x64.exe"

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Install boxednode Globally
        run: npm install -g boxednode
        
      - name: Setup Build Environment & Compile
        run: |
          ${{ matrix.setup_cmd }}
          ${{ matrix.build_cmd }}
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.final_name }}
          path: ./${{ matrix.final_name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: launcher-linux-x64
          
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: launcher-win-x64.exe
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            launcher-linux-x64
            launcher-win-x64.exe
