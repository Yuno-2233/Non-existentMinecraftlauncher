name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target_os: linux
            output_ext: "" # Linux无后缀
          - os: macos-latest
            target_os: macos
            output_ext: "" # Mac无后缀
          - os: windows-latest
            target_os: win
            output_ext: ".exe" # Windows需要.exe后缀

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      # 1. 安装 boxednode
      - name: Install boxednode Globally
        run: npm install -g boxednode

      # 2. 安装 UPX (关键修复：强制使用 bash 运行，解决 Windows PowerShell 报错)
      - name: Install UPX
        shell: bash 
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            sudo apt-get update && sudo apt-get install -y upx-ucl
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            choco install upx --no-progress
          fi
          # macOS 默认自带或不需要额外复杂安装，若需要可加 brew install upx

      # 3. 编译可执行文件
      - name: Build Executable with boxednode
        shell: bash
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          TARGET="${{ matrix.target_os }}"
          EXT="${{ matrix.output_ext }}"
          
          OUTPUT_FILE="${REPO_NAME}-${TARGET}${EXT}"
          
          echo "Building for $TARGET..."
          
          # 执行编译，指定入口 main.js 和目标平台
          boxednode --source ./main.js -t $TARGET -o $OUTPUT_FILE
          
          # 如果生成了文件，尝试用 UPX 压缩以减小体积
          if [ -f "$OUTPUT_FILE" ]; then
            echo "Compressing with UPX..."
            upx --best --lzma $OUTPUT_FILE || echo "UPX compression failed or skipped."
          else
            echo "Error: Build failed, file not found."
            exit 1
          fi

      # 4. 上传构建产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target_os }}
          path: ${{ github.event.repository.name }}-${{ matrix.target_os }}${{ matrix.output_ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: build-*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
