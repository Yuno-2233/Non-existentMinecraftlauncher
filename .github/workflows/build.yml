name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如: v2.0.1)'
        required: true
        type: string
      prerelease:
        description: '是否标记为预发布版本'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Resolve version name
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release package
        run: |
          mkdir -p build/release

          # 智能查找构建产物（排除 sources 和 javadoc）
          JAR_FILE=$(find app/build/libs -name "*.jar" -not -name "*-sources.jar" -not -name "*-javadoc.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "❌ 错误：未在 app/build/libs 中找到有效的 JAR 文件！"
            exit 1
          fi

          JAR_NAME=$(basename "$JAR_FILE")
          echo "✅ 检测到构建产物: $JAR_NAME"

          # 复制 JAR 包（保持原始命名规范）
          cp "$JAR_FILE" build/release/

          # 动态生成 Windows 启动脚本
          cat > build/release/start.bat <<EOF
@echo off
title Non-existent Minecraft Launcher
echo Starting $JAR_NAME ...
java -Xms512m -Xmx2G -jar "$JAR_NAME" %*
pause
EOF

          # 动态生成 Linux/Mac 启动脚本
          cat > build/release/start.sh <<'OUTER_EOF'
#!/bin/bash
DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
JAR_FILE=$(find "$DIR" -maxdepth 1 -name "*.jar" | head -n 1)

if [ -z "$JAR_FILE" ]; then
    echo "Error: No JAR file found in the current directory."
    exit 1
fi

echo "Starting $(basename "$JAR_FILE") ..."
java -Xms512m -Xmx2G -jar "$JAR_FILE" "$@"
OUTER_EOF

          chmod +x build/release/start.sh

          echo "📦 发布包内容预览："
          ls -lh build/release/

      - name: Package release zip
        run: |
          cd build/release
          zip -r ../Non-existentMinecraftLauncher-${{ steps.version.outputs.name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          files: build/Non-existentMinecraftLauncher-${{ steps.version.outputs.name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || (contains(steps.version.outputs.name, '-alpha') || contains(steps.version.outputs.name, '-beta') || contains(steps.version.outputs.name, '-rc')) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
