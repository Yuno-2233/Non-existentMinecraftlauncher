name: Build and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci  # 确保仓库中有 package-lock.json，否则改用 npm install

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm test

  build-linux:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 upx-ucl

      - name: Install Project Dependencies
        run: npm ci

      - name: Install boxednode
        run: npm install -g boxednode

      - name: Compile Linux Binary
        run: |
          boxednode --source ./main.js --output ./Non-existentMinecraftLauncher_linux_x64
          if [ ! -f "./Non-existentMinecraftLauncher_linux_x64" ]; then
            echo "错误：编译完成但未找到文件！"
            exit 1
          fi
          chmod +x ./Non-existentMinecraftLauncher_linux_x64

      - name: Compress with UPX
        run: upx --best ./Non-existentMinecraftLauncher_linux_x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: ./Non-existentMinecraftLauncher_linux_x64

  build-windows:
    needs: lint-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install boxednode
        run: npm install -g boxednode

      - name: Compile Windows Binary
        run: |
          boxednode --source ./main.js --output ./Non-existentMinecraftLauncher_windows_x64.exe
          if (-Not (Test-Path "./Non-existentMinecraftLauncher_windows_x64.exe")) {
            Write-Error "编译失败：未找到文件"
            exit 1
          }
        shell: pwsh

      - name: Compress with UPX
        run: upx --best ./Non-existentMinecraftLauncher_windows_x64.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: ./Non-existentMinecraftLauncher_windows_x64.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: ./dist

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: ./dist

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-test.${{ github.run_number }}
          name: Test Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: true
          files: |
            ./dist/Non-existentMinecraftLauncher_linux_x64
            ./dist/Non-existentMinecraftLauncher_windows_x64.exe
