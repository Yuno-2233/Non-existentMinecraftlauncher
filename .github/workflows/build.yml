name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            output_name: linux-x64
          - os: macos-latest
            target: darwin-x64
            output_name: macos-x64
          - os: windows-latest
            target: win-x64
            output_name: win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      # 1. 安装 boxednode
      - name: Install boxednode Globally
        run: npm install -g boxednode

      # 2. 安装 UPX (用于压缩体积)
      - name: Install UPX
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get install -y upx
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            brew install upx
          else
            choco install upx --no-progress
          fi

      # 3. 使用 boxednode 编译 + UPX 压缩
      - name: Build Executable with boxednode
        run: |
          OUTPUT_NAME="${{ github.event.repository.name }}-${{ matrix.output_name }}"
          boxednode --source ./main.js -t ${{ matrix.target }} -o $OUTPUT_NAME
          
          # 压缩体积（UPX 可将文件缩小 50%-70%）
          upx --best --lzma $OUTPUT_NAME || echo "UPX compression skipped for this platform"

      # 4. 上传构建产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ${{ github.event.repository.name }}-${{ matrix.output_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            */*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
