<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新日志 - NEML</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%2358a6ff;stop-opacity:1'/><stop offset='100%25' style='stop-color:%23bc8cff;stop-opacity:1'/></linearGradient></defs><text x='50' y='80' font-family='system-ui,sans-serif' font-size='80' font-weight='bold' fill='url(%23g)' text-anchor='middle'>N</text></svg>">
</head>
<body>
    <nav>
        <span class="logo-text">NEML</span>
        <div>
            <a href="index.html">首页</a>
            <a href="docs.html">文档</a>
            <a href="download.html">下载</a>
            <a href="changelog.html">更新日志</a>
            <a href="https://github.com/Yuno-2233/Non-existentMinecraftlauncher">GitHub</a>
        </div>
    </nav>
    <div class="container">
        <h1>更新日志</h1>
        <div id="changelog"></div>
    </div>
    <footer>
        <p>NEML 2025-2026 | MIT License | <a href="https://github.com/Yuno-2233/Non-existentMinecraftlauncher">GitHub</a></p>
    </footer>
    <script>
        fetch('changelog.json')
            .then(response => response.json())
            .then(data => {
                const changelogDiv = document.getElementById('changelog');
                data.forEach(entry => {
                    const versionDiv = document.createElement('div');
                    versionDiv.className = 'version';
                    versionDiv.innerHTML = `
                        <div class="version-header">
                            <span class="version-num">${entry.version}</span>
                            <span class="version-date">${entry.date}</span>
                        </div>
                        <ul class="changes-list">
                            ${entry.changes.map(change => `<li>${change}</li>`).join('')}
                        </ul>
                    `;
                    changelogDiv.appendChild(versionDiv);
                });
            })
            .catch(err => {
                document.getElementById('changelog').innerHTML = '<p>加载日志失败，请稍后重试。</p>';
                console.error(err);
            });
    </script>
</body>
</html>
