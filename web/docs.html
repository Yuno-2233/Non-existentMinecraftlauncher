<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档 - NEML</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%2358a6ff;stop-opacity:1'/><stop offset='100%25' style='stop-color:%23bc8cff;stop-opacity:1'/></linearGradient></defs><text x='50' y='80' font-family='system-ui,sans-serif' font-size='80' font-weight='bold' fill='url(%23g)' text-anchor='middle'>N</text></svg>">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
    <style>
        .reader-container {
            display: flex;
            height: calc(100vh - 130px);
            margin-top: 20px;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            background: #161b22;
        }
        .sidebar {
            width: 250px;
            background: #0d1117;
            border-right: 1px solid #30363d;
            overflow-y: auto;
            padding: 15px;
        }
        .sidebar h3 { color: #f0f6fc; margin-bottom: 10px; }
        .sidebar ul { list-style: none; }
        .sidebar li {
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            color: #c9d1d9;
            margin-bottom: 2px;
        }
        .sidebar li:hover { background: #21262d; }
        .sidebar li.active { background: #1f6feb; color: #fff; }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            color: #c9d1d9;
        }
    </style>
</head>
<body>
    <nav>
        <span class="logo-text">NEML</span>
        <div>
            <a href="index.html">首页</a>
            <a href="docs.html">文档</a>
            <a href="download.html">下载</a>
            <a href="changelog.html">更新日志</a>
            <a href="https://github.com/Yuno-2233/Non-existentMinecraftlauncher">GitHub</a>
        </div>
    </nav>
    <div class="container">
        <h1>项目文档</h1>
        <div class="reader-container">
            <aside class="sidebar">
                <h3>目录</h3>
                <ul id="toc"></ul>
            </aside>
            <main class="content" id="reader-content"></main>
        </div>
    </div>
    <footer>
        <p>NEML 2025-2026 | MIT License | <a href="https://github.com/Yuno-2233/Non-existentMinecraftlauncher">GitHub</a></p>
    </footer>
    <script>
        (async function() {
            const contentDiv = document.getElementById('reader-content');
            const tocList = document.getElementById('toc');
            try {
                const book = ePub('docs.epub');
                const rendition = book.renderTo('reader-content', {
                    width: '100%',
                    height: '100%',
                    spread: 'none',
                    flow: 'paginated',
                    manager: 'default'
                });
                await book.ready;
                const toc = book.navigation.toc;
                function buildToc(items, parent) {
                    items.forEach(item => {
                        const li = document.createElement('li');
                        li.textContent = item.label;
                        li.setAttribute('data-href', item.href);
                        li.addEventListener('click', () => {
                            rendition.display(item.href);
                            document.querySelectorAll('.sidebar li').forEach(el => el.classList.remove('active'));
                            li.classList.add('active');
                        });
                        parent.appendChild(li);
                        if (item.subitems && item.subitems.length > 0) {
                            const ul = document.createElement('ul');
                            li.appendChild(ul);
                            buildToc(item.subitems, ul);
                        }
                    });
                }
                buildToc(toc, tocList);
                if (toc.length > 0) {
                    await rendition.display(toc[0].href);
                    const firstLi = tocList.querySelector('li');
                    if (firstLi) firstLi.classList.add('active');
                }
                rendition.on('rendered', (section) => {
                    document.querySelectorAll('.sidebar li').forEach(li => li.classList.remove('active'));
                    const matchingLi = document.querySelector(`.sidebar li[data-href="${section.href}"]`);
                    if (matchingLi) matchingLi.classList.add('active');
                });
            } catch (error) {
                console.error('加载文档失败:', error);
                contentDiv.innerHTML = '<p style="text-align:center;padding:40px;color:#8b949e;">文档加载失败，请确保 docs.epub 文件存在且格式正确。错误信息：' + error.message + '</p>';
            }
        })();
    </script>
</body>
</html>
