<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档 - NEML</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%2358a6ff;stop-opacity:1'/><stop offset='100%25' style='stop-color:%23bc8cff;stop-opacity:1'/></linearGradient></defs><text x='50' y='80' font-family='system-ui,sans-serif' font-size='80' font-weight='bold' fill='url(%23g)' text-anchor='middle'>N</text></svg>">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .doc-container {
            display: flex;
            min-height: calc(100vh - 130px);
            margin-top: 20px;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            background: #161b22;
        }
        .sidebar {
            width: 250px;
            background: #0d1117;
            border-right: 1px solid #30363d;
            overflow-y: auto;
            padding: 15px;
        }
        .sidebar h3 { color: #f0f6fc; margin-bottom: 10px; }
        .sidebar ul { list-style: none; }
        .sidebar li {
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            color: #c9d1d9;
            margin-bottom: 2px;
        }
        .sidebar li:hover { background: #21262d; }
        .sidebar li.active { background: #1f6feb; color: #fff; }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            color: #c9d1d9;
        }
        .content h1, .content h2, .content h3 {
            color: #f0f6fc;
            margin: 1em 0 0.5em;
        }
        .content p { line-height: 1.6; margin-bottom: 1em; }
        .content code {
            background: #2d333b;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
        }
        .content pre {
            background: #21262d;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <nav>
        <span class="logo-text">NEML</span>
        <div>
            <a href="index.html">首页</a>
            <a href="docs.html">文档</a>
            <a href="download.html">下载</a>
            <a href="changelog.html">更新日志</a>
            <a href="https://github.com/Yuno-2233/Non-existentMinecraftlauncher">GitHub</a>
        </div>
    </nav>
    <div class="container">
        <h1>项目文档</h1>
        <div class="doc-container">
            <aside class="sidebar">
                <h3>目录</h3>
                <ul id="toc"></ul>
            </aside>
            <main class="content" id="reader-content"></main>
        </div>
    </div>
    <footer>
        <p>NEML 2025-2026 | MIT License | <a href="https://github.com/Yuno-2233/Non-existentMinecraftlauncher">GitHub</a></p>
    </footer>
    <script>
        (async function() {
            const tocList = document.getElementById('toc');
            const contentDiv = document.getElementById('reader-content');

            try {
                // 加载目录结构
                const tocRes = await fetch('docs/index.json');
                const tocData = await tocRes.json();

                // 存储章节信息，用于参数匹配
                const chapterMap = {};

                // 构建侧边栏
                tocData.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.textContent = item.title;
                    li.setAttribute('data-file', item.file);
                    li.addEventListener('click', () => {
                        loadDocument(item.file);
                        document.querySelectorAll('.sidebar li').forEach(el => el.classList.remove('active'));
                        li.classList.add('active');
                        // 更新 URL 参数
                        history.replaceState(null, '', '?page=' + encodeURIComponent(item.file));
                    });
                    tocList.appendChild(li);
                    chapterMap[item.file] = li;
                });

                // 解析 URL 参数，获取目标章节
                const urlParams = new URLSearchParams(window.location.search);
                const targetPage = urlParams.get('page');

                let defaultFile = tocData.length > 0 ? tocData[0].file : null;
                let targetFile = targetPage || defaultFile;
                let targetLi = chapterMap[targetFile];

                if (targetLi) {
                    await loadDocument(targetFile);
                    // 高亮对应侧边栏
                    document.querySelectorAll('.sidebar li').forEach(el => el.classList.remove('active'));
                    targetLi.classList.add('active');
                    // 保证 URL 参数与当前显示一致（无参数时自动补上）
                    if (!targetPage) {
                        history.replaceState(null, '', '?page=' + encodeURIComponent(targetFile));
                    }
                } else {
                    // 如果指定的文件不存在，加载第一个
                    if (defaultFile) {
                        await loadDocument(defaultFile);
                        const firstLi = tocList.querySelector('li');
                        if (firstLi) firstLi.classList.add('active');
                        history.replaceState(null, '', '?page=' + encodeURIComponent(defaultFile));
                    } else {
                        contentDiv.innerHTML = '<p>文档中没有内容。</p>';
                    }
                }
            } catch (error) {
                contentDiv.innerHTML = '<p>无法加载文档目录。</p>';
                console.error(error);
            }

            async function loadDocument(filename) {
                try {
                    const res = await fetch(`docs/${filename}`);
                    const markdown = await res.text();
                    contentDiv.innerHTML = marked.parse(markdown);
                } catch (error) {
                    contentDiv.innerHTML = `<p>无法加载文档：${filename}</p>`;
                    console.error(error);
                }
            }
        })();
    </script>
</body>
</html>
