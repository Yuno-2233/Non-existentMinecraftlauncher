<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档 - NEML</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%2358a6ff;stop-opacity:1'/><stop offset='100%25' style='stop-color:%23bc8cff;stop-opacity:1'/></linearGradient></defs><text x='50' y='80' font-family='system-ui,sans-serif' font-size='80' font-weight='bold' fill='url(%23g)' text-anchor='middle'>N</text></svg>">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
    <style>
        /* 阅读器容器 */
        .reader-container {
            display: flex;
            height: calc(100vh - 130px); /* 减去导航栏和页脚高度 */
            margin-top: 20px;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            background: #161b22;
        }
        /* 侧边栏 */
        .sidebar {
            width: 250px;
            background: #0d1117;
            border-right: 1px solid #30363d;
            overflow-y: auto;
            padding: 15px;
        }
        .sidebar h3 {
            color: #f0f6fc;
            margin-bottom: 10px;
        }
        .sidebar ul {
            list-style: none;
        }
        .sidebar li {
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            color: #c9d1d9;
            margin-bottom: 2px;
        }
        .sidebar li:hover {
            background: #21262d;
        }
        .sidebar li.active {
            background: #1f6feb;
            color: #fff;
        }
        /* 内容区域 */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            color: #c9d1d9;
        }
        .content h1, .content h2, .content h3 {
            color: #f0f6fc;
            margin: 1em 0 0.5em;
        }
        .content p {
            line-height: 1.6;
            margin-bottom: 1em;
        }
        .content code {
            background: #2d333b;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
            color: #f0f6fc;
        }
        .content pre {
            background: #21262d;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 15px 0;
        }
        /* 加载提示 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }
    </style>
</head>
<body>
    <nav>
        <span class="logo-text">NEML</span>
        <div>
            <a href="index.html">首页</a>
            <a href="docs.html">文档</a>
            <a href="download.html">下载</a>
            <a href="changelog.html">更新日志</a>
            <a href="https://github.com/Yuno-2233/Non-existentMinecraftlauncher">GitHub</a>
        </div>
    </nav>
    <div class="container">
        <h1>项目文档</h1>
        <div class="reader-container">
            <aside class="sidebar">
                <h3>目录</h3>
                <ul id="toc"></ul>
            </aside>
            <main class="content" id="reader-content">
                <div class="loading">正在加载文档...</div>
            </main>
        </div>
    </div>
    <footer>
        <p>NEML 2025-2026 | MIT License | <a href="https://github.com/Yuno-2233/Non-existentMinecraftlauncher">GitHub</a></p>
    </footer>
    <script>
        (async function() {
            const book = ePub('docs.epub');
            const rendition = book.renderTo('reader-content', {
                width: '100%',
                height: '100%',
                spread: 'none',
                flow: 'paginated',
                manager: 'default'
            });

            // 生成侧边栏目录
            const toc = await book.loaded.navigation;
            const tocList = document.getElementById('toc');

            function buildToc(items, parent) {
                items.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item.label;
                    li.addEventListener('click', () => {
                        rendition.display(item.href);
                        // 高亮当前项
                        document.querySelectorAll('.sidebar li').forEach(el => el.classList.remove('active'));
                        li.classList.add('active');
                    });
                    parent.appendChild(li);

                    if (item.subitems && item.subitems.length > 0) {
                        const ul = document.createElement('ul');
                        li.appendChild(ul);
                        buildToc(item.subitems, ul);
                    }
                });
            }

            buildToc(toc, tocList);

            // 默认显示第一章
            if (toc.length > 0) {
                rendition.display(toc[0].href);
                tocList.firstChild?.classList.add('active');
            }

            // 监听页面切换，同步高亮
            rendition.on('rendered', (section) => {
                document.querySelectorAll('.sidebar li').forEach(li => li.classList.remove('active'));
                const href = section.href;
                const links = document.querySelectorAll('.sidebar li');
                links.forEach(li => {
                    // 简单匹配：检查点击时保存的 href（可通过事件绑定存储）
                    // 这里简化处理：遍历目录，根据 section 的 href 匹配
                    if (li.textContent === section.index) { // 不准确，需要更精确的映射
                        li.classList.add('active');
                    }
                });
                // 更可靠的方法：在 buildToc 时给每个 li 添加 data-href 属性
            });
        })();
    </script>
</body>
</html>
